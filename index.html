<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinetic Strings & Percussion</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    background-color: #0d0f12;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  #ui {
    position: absolute;
    top: 20px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .hint {
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
  }
  .controls {
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }
  button {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.75);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
  }
  button:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
  }
  button.active {
    background: rgba(56, 189, 248, 0.18);
    border-color: rgba(56, 189, 248, 0.5);
    color: #38bdf8;
  }
</style>
</head>
<body>

<div id="ui">
  <div class="hint">Strum strings • Tap shapes • Click space to launch orbs</div>
  <div class="controls">
    <button id="emitterBtn" class="active">Auto-Orbs: ON</button>
    <button id="addOrbBtn">+ Launch Orb</button>
    <button id="clearBtn">Clear Orbs & Staff</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, staffTop, playAreaHeight;

// --- Web Audio API Synthesizer ---
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playGuitarNote(freq) {
  initAudio();
  const now = audioCtx.currentTime;

  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  const gain = audioCtx.createGain();

  // Warm plucked string timbre
  osc1.type = 'triangle';
  osc2.type = 'sawtooth';
  osc1.frequency.setValueAtTime(freq, now);
  osc2.frequency.setValueAtTime(freq * 1.002, now); // Slight detune for chorus warmth

  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(freq * 5, now);
  filter.frequency.exponentialRampToValueAtTime(freq * 1.2, now + 1.2);

  gain.gain.setValueAtTime(0.001, now);
  gain.gain.linearRampToValueAtTime(0.28, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.8);

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + 1.85);
  osc2.stop(now + 1.85);
}

function playDrum(type) {
  initAudio();
  const now = audioCtx.currentTime;

  if (type === 'kick') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(32, now + 0.35);
    gain.gain.setValueAtTime(0.7, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  } else if (type === 'snare') {
    // Noise burst
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(600, now);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);

    // Body tone
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    oscGain.gain.setValueAtTime(0.3, now);
    oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.connect(oscGain);
    oscGain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (type === 'hat') {
    const bufferSize = audioCtx.sampleRate * 0.08;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(6500, now);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);
  }
}

// --- Musical Elements ---
// E4, D4, B3, G3, E3, C3 (Harmonious minor/pentatonic voicing)
// staffStep: 0 = bottom line (E4), positive = steps upward on the 5-line staff
const stringDefs = [
  { name: 'E5', freq: 659.25, step: 7, color: '#38bdf8' },
  { name: 'B4', freq: 493.88, step: 4, color: '#818cf8' },
  { name: 'G4', freq: 392.00, step: 2, color: '#c084fc' },
  { name: 'E4', freq: 329.63, step: 0, color: '#f472b6' },
  { name: 'D4', freq: 293.66, step: -1, color: '#fb7185' },
  { name: 'A3', freq: 220.00, step: -3, color: '#fbbf24' }
];

let strings = [];
let drums = [];
let orbs = [];
let sheetNotes = [];
let ripples = [];

let autoEmit = true;
let lastEmitTime = 0;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  staffTop = height * 0.74;
  playAreaHeight = staffTop - 40;

  // Position 6 horizontal guitar strings on the left/center
  const stringStartX = width * 0.08;
  const stringEndX = width * 0.58;
  const topY = playAreaHeight * 0.22;
  const spacing = (playAreaHeight * 0.65) / (stringDefs.length - 1);

  strings = stringDefs.map((def, i) => ({
    ...def,
    x1: stringStartX,
    x2: stringEndX,
    y: topY + i * spacing,
    amp: 0,
    vel: 0,
    nodeX: (stringStartX + stringEndX) / 2,
    nodeRadius: 16
  }));

  // Position 3 geometric drum shapes on the right
  const drumX = width * 0.78;
  drums = [
    {
      name: 'Hi-Hat',
      drumType: 'hat',
      shape: 'triangle',
      x: drumX,
      y: playAreaHeight * 0.26,
      radius: 38,
      color: '#fde047',
      step: 8,
      pulse: 0
    },
    {
      name: 'Snare',
      drumType: 'snare',
      shape: 'diamond',
      x: drumX + 45,
      y: playAreaHeight * 0.53,
      radius: 42,
      color: '#fb923c',
      step: 4,
      pulse: 0
    },
    {
      name: 'Kick',
      drumType: 'kick',
      shape: 'hexagon',
      x: drumX - 15,
      y: playAreaHeight * 0.80,
      radius: 48,
      color: '#f87171',
      step: 0,
      pulse: 0
    }
  ];
}

window.addEventListener('resize', resize);
resize();

// --- Note & Ripple Triggers ---
function triggerString(s, hitX) {
  playGuitarNote(s.freq);
  s.amp = 24;
  const rippleX = hitX || s.nodeX;
  ripples.push({ x: rippleX, y: s.y, r: 6, maxR: 45, color: s.color, alpha: 1 });
  addSheetNote(s.step, s.color, 'note', s.name);
}

function triggerDrum(d) {
  playDrum(d.drumType);
  d.pulse = 14;
  ripples.push({ x: d.x, y: d.y, r: d.radius * 0.8, maxR: d.radius * 1.9, color: d.color, alpha: 1 });
  addSheetNote(d.step, d.color, 'drum', d.name);
}

function addSheetNote(step, color, kind, label) {
  sheetNotes.push({
    x: width * 0.88,
    step,
    color,
    kind,
    label,
    alpha: 1,
    born: performance.now()
  });
}

// --- Orb Spawning ---
function spawnOrb(x, y, vx, vy) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 2.6 + Math.random() * 1.8;
  orbs.push({
    x: x !== undefined ? x : width * 0.08 + Math.random() * (width * 0.8),
    y: y !== undefined ? y : 70,
    vx: vx !== undefined ? vx : Math.cos(angle) * speed,
    vy: vy !== undefined ? vy : Math.abs(Math.sin(angle)) * speed + 1.2,
    r: 7,
    cooldowns: new Map()
  });
  if (orbs.length > 10) orbs.shift();
}

// Spawn initial orb
spawnOrb(width * 0.35, 90, 3.2, 2.4);

// --- Pointer Interaction ---
let pointer = { x: 0, y: 0, prevX: 0, prevY: 0, down: false };

function segmentsIntersect(x1, y1, x2, y2, x3, y3, x4, y4) {
  const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
  if (denom === 0) return false;
  const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
  const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
  return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
}

canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  pointer.down = true;
  pointer.x = pointer.prevX = e.clientX;
  pointer.y = pointer.prevY = e.clientY;

  // Check if clicked on a drum shape
  let hitSomething = false;
  for (const d of drums) {
    const dist = Math.hypot(pointer.x - d.x, pointer.y - d.y);
    if (dist <= d.radius + 8) {
      triggerDrum(d);
      hitSomething = true;
    }
  }

  // Check if clicked near a string resonating node
  for (const s of strings) {
    const dist = Math.hypot(pointer.x - s.nodeX, pointer.y - s.y);
    if (dist <= s.nodeRadius + 8) {
      triggerString(s, s.nodeX);
      hitSomething = true;
    }
  }

  // Otherwise spawn a moving orb where clicked (if in upper play area)
  if (!hitSomething && pointer.y < staffTop - 20 && pointer.y > 60) {
    const angle = (Math.random() - 0.5) * Math.PI * 1.4;
    spawnOrb(pointer.x, pointer.y, Math.sin(angle) * 3.5, Math.cos(angle) * 3.2);
  }
});

canvas.addEventListener('pointermove', (e) => {
  pointer.prevX = pointer.x;
  pointer.prevY = pointer.y;
  pointer.x = e.clientX;
  pointer.y = e.clientY;

  // Strum strings by moving across them
  for (const s of strings) {
    if (segmentsIntersect(pointer.prevX, pointer.prevY, pointer.x, pointer.y, s.x1, s.y, s.x2, s.y)) {
      triggerString(s, pointer.x);
    }
  }

  // Pass over drum shapes with mouse while dragging
  if (pointer.down) {
    for (const d of drums) {
      const prevDist = Math.hypot(pointer.prevX - d.x, pointer.prevY - d.y);
      const currDist = Math.hypot(pointer.x - d.x, pointer.y - d.y);
      if (prevDist > d.radius && currDist <= d.radius) {
        triggerDrum(d);
      }
    }
  }
});

window.addEventListener('pointerup', () => {
  pointer.down = false;
});

// --- UI Buttons ---
const emitterBtn = document.getElementById('emitterBtn');
emitterBtn.addEventListener('click', () => {
  initAudio();
  autoEmit = !autoEmit;
  emitterBtn.textContent = `Auto-Orbs: ${autoEmit ? 'ON' : 'OFF'}`;
  emitterBtn.classList.toggle('active', autoEmit);
});

document.getElementById('addOrbBtn').addEventListener('click', () => {
  initAudio();
  spawnOrb();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  orbs = [];
  sheetNotes = [];
});

// --- Polygon Drawing Helper ---
function drawPolygon(x, y, radius, sides, rotation = 0) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = rotation + (i * 2 * Math.PI) / sides;
    const px = x + Math.cos(a) * radius;
    const py = y + Math.sin(a) * radius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

// --- Main Animation Loop ---
function animate(now) {
  ctx.clearRect(0, 0, width, height);

  // Auto-spawn gentle orbs periodically if enabled
  if (autoEmit && orbs.length < 4 && now - lastEmitTime > 3200) {
    spawnOrb();
    lastEmitTime = now;
  }

  // 1. Draw & Update Guitar Strings
  for (const s of strings) {
    // Spring damping for string vibration
    s.amp *= 0.91;
    const offset = Math.sin(now * 0.065) * s.amp;

    // String line
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y);
    ctx.quadraticCurveTo((s.x1 + s.x2) / 2, s.y + offset, s.x2, s.y);
    ctx.strokeStyle = s.amp > 0.8 ? s.color : 'rgba(255, 255, 255, 0.22)';
    ctx.lineWidth = 1.5 + (s.amp / 12);
    ctx.stroke();

    // Endpoints
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.beginPath();
    ctx.arc(s.x1, s.y, 3, 0, Math.PI * 2);
    ctx.arc(s.x2, s.y, 3, 0, Math.PI * 2);
    ctx.fill();

    // Resonator shape in the center of the string
    ctx.save();
    ctx.translate(s.nodeX, s.y + offset * 0.5);
    ctx.rotate(Math.PI / 4);
    const sz = s.nodeRadius + s.amp * 0.25;
    ctx.strokeStyle = s.color;
    ctx.fillStyle = 'rgba(13, 15, 18, 0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(-sz / 2, -sz / 2, sz, sz);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Subtle note label
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.font = '11px sans-serif';
    ctx.fillText(s.name, s.x1 - 28, s.y + 4);
  }

  // 2. Draw & Update Drum Shapes
  for (const d of drums) {
    d.pulse *= 0.88;
    const r = d.radius + d.pulse;

    ctx.save();
    ctx.strokeStyle = d.color;
    ctx.fillStyle = d.pulse > 1 ? `${d.color}22` : 'rgba(255, 255, 255, 0.02)';
    ctx.lineWidth = 2 + d.pulse * 0.15;

    if (d.shape === 'triangle') {
      drawPolygon(d.x, d.y, r, 3, -Math.PI / 2);
    } else if (d.shape === 'diamond') {
      drawPolygon(d.x, d.y, r, 4, 0);
    } else {
      drawPolygon(d.x, d.y, r, 6, Math.PI / 6);
    }
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.name.toUpperCase(), d.x, d.y + 4);
    ctx.restore();
  }

  // 3. Update & Draw Moving Orbs
  for (const orb of orbs) {
    const prevX = orb.x;
    const prevY = orb.y;

    orb.x += orb.vx;
    orb.y += orb.vy;

    // Bounce off walls within the play area
    if (orb.x < orb.r || orb.x > width - orb.r) orb.vx *= -1;
    if (orb.y < 55 || orb.y > staffTop - 25) orb.vy *= -1;

    // Check if orb crossed any guitar string
    for (const s of strings) {
      const lastHit = orb.cooldowns.get(s) || 0;
      if (now - lastHit > 180) {
        if (segmentsIntersect(prevX, prevY, orb.x, orb.y, s.x1, s.y, s.x2, s.y)) {
          triggerString(s, orb.x);
          orb.cooldowns.set(s, now);
        }
      }
    }

    // Check if orb moved past / through any drum shape
    for (const d of drums) {
      const lastHit = orb.cooldowns.get(d) || 0;
      const dist = Math.hypot(orb.x - d.x, orb.y - d.y);
      if (dist < d.radius + orb.r && now - lastHit > 320) {
        triggerDrum(d);
        orb.cooldowns.set(d, now);
        // Gentle deflection
        const angle = Math.atan2(orb.y - d.y, orb.x - d.x);
        const speed = Math.hypot(orb.vx, orb.vy);
        orb.vx = Math.cos(angle) * speed;
        orb.vy = Math.sin(angle) * speed;
      }
    }

    // Draw orb glow
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 4. Draw Ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += (rp.maxR - rp.r) * 0.14;
    rp.alpha *= 0.90;

    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
    ctx.strokeStyle = rp.color;
    ctx.globalAlpha = rp.alpha;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (rp.alpha < 0.03) ripples.splice(i, 1);
  }

  // 5. Draw Scrolling Sheet Music Staff at the Bottom
  const lineSpacing = 13;
  const staffLines = 5;
  const bottomLineY = staffTop + 45 + (staffLines - 1) * lineSpacing;
  const staffLeft = width * 0.06;
  const staffRight = width * 0.94;

  // Draw the 5 horizontal staff lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
  ctx.lineWidth = 1;
  for (let i = 0; i < staffLines; i++) {
    const ly = bottomLineY - i * lineSpacing;
    ctx.beginPath();
    ctx.moveTo(staffLeft, ly);
    ctx.lineTo(staffRight, ly);
    ctx.stroke();
  }

  // Minimalist Treble Clef & Playhead bar
  ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.font = '46px serif';
  ctx.fillText('𝄞', staffLeft + 10, bottomLineY - 8);

  // Subtle entry line on the right where new notes appear
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
  ctx.beginPath();
  ctx.moveTo(width * 0.88, bottomLineY - 4 * lineSpacing - 12);
  ctx.lineTo(width * 0.88, bottomLineY + 12);
  ctx.stroke();

  // Update & Draw Sheet Music Notes
  for (let i = sheetNotes.length - 1; i >= 0; i--) {
    const n = sheetNotes[i];
    n.x -= 1.6; // Scroll left across the staff

    const ny = bottomLineY - n.step * (lineSpacing / 2);

    // Fade out as notes approach the clef on the left
    if (n.x < staffLeft + 75) {
      n.alpha -= 0.05;
    }

    ctx.save();
    ctx.globalAlpha = Math.max(0, n.alpha);
    ctx.strokeStyle = n.color;
    ctx.fillStyle = n.color;

    // Draw Ledger line if below the bottom line (e.g. A3)
    if (n.step <= -2) {
      const ledgerY = bottomLineY + lineSpacing;
      ctx.beginPath();
      ctx.moveTo(n.x - 12, ledgerY);
      ctx.lineTo(n.x + 12, ledgerY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.stroke();
      ctx.strokeStyle = n.color;
    }

    if (n.kind === 'note') {
      // Filled oval notehead
      ctx.beginPath();
      ctx.ellipse(n.x, ny, 7, 5, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // Note stem
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      if (n.step >= 4) {
        ctx.moveTo(n.x - 6, ny);
        ctx.lineTo(n.x - 6, ny + 28);
      } else {
        ctx.moveTo(n.x + 6, ny);
        ctx.lineTo(n.x + 6, ny - 28);
      }
      ctx.stroke();
    } else {
      // Percussion X-notehead
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(n.x - 5, ny - 5);
      ctx.lineTo(n.x + 5, ny + 5);
      ctx.moveTo(n.x + 5, ny - 5);
      ctx.lineTo(n.x - 5, ny + 5);
      ctx.stroke();

      // Stem
      ctx.beginPath();
      ctx.moveTo(n.x + 5, ny - 5);
      ctx.lineTo(n.x + 5, ny - 28);
      ctx.stroke();
    }

    // Small pitch/drum label underneath or above
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.fillText(n.label, n.x, bottomLineY + 26);

    ctx.restore();

    if (n.alpha <= 0) {
      sheetNotes.splice(i, 1);
    }
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
