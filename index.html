<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA — Next-Gen Web Audio Experience</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0a0a0f;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --accent: #ff2a5f;
      --accent-glow: rgba(255, 42, 95, 0.4);
      --text-main: #ffffff;
      --text-muted: #a0a0b0;
      --glass-border: rgba(255, 255, 255, 0.08);
      --sidebar-width: 260px;
      --player-height: 90px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: var(--sidebar-width);
      background: rgba(15, 15, 22, 0.8);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 24px;
      backdrop-filter: blur(20px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
    }

    .brand i {
      color: var(--accent);
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-main);
      background: var(--bg-card-hover);
    }

    .nav-item.active i {
      color: var(--accent);
    }

    /* Main Section */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--player-height));
      overflow-y: auto;
      padding: 24px 32px;
      position: relative;
    }

    /* Header & Search */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 10px 18px;
      border-radius: 30px;
      width: 360px;
      transition: all 0.3s ease;
    }

    .search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .search-bar input {
      background: none;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      font-size: 14px;
    }

    .file-upload-btn {
      background: linear-gradient(135deg, var(--accent), #e01e4f);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.2s ease;
    }

    .file-upload-btn:hover {
      transform: translateY(-2px);
    }

    #file-input {
      display: none;
    }

    /* Visualizer & Hero Canvas */
    .hero-banner {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 42, 95, 0.15) 0%, rgba(10, 10, 15, 0) 100%);
      border-radius: 20px;
      padding: 28px;
      border: 1px solid var(--glass-border);
      margin-bottom: 32px;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-text h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .hero-text p {
      color: var(--text-muted);
      font-size: 14px;
    }

    #visualizer {
      width: 280px;
      height: 80px;
    }

    /* Grid Layout */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .music-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .music-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-5px);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .card-img-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .music-card:hover .play-overlay {
      opacity: 1;
    }

    .play-btn-icon {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-artist {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Fixed Bottom Player Bar */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--player-height);
      background: rgba(12, 12, 18, 0.95);
      border-top: 1px solid var(--glass-border);
      backdrop-filter: blur(25px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 100;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 25%;
    }

    .track-thumb {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      background: #1a1a24;
    }

    .track-details .name {
      font-size: 14px;
      font-weight: 700;
    }

    .track-details .artist {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Player Controls */
    .controls-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 40%;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-action {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-action:hover, .btn-action.active {
      color: var(--text-main);
    }

    .btn-play-pause {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-play-pause:hover {
      transform: scale(1.08);
    }

    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      position: relative;
    }

    /* Volume */
    .extra-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      width: 25%;
    }

    .volume-slider {
      width: 100px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <i class="fa-solid fa-wave-square"></i>
      <span>AURA</span>
    </div>
    <ul class="nav-list">
      <li class="nav-item active"><i class="fa-solid fa-house"></i> Home</li>
      <li class="nav-item"><i class="fa-solid fa-compass"></i> Discover</li>
      <li class="nav-item"><i class="fa-solid fa-list-ul"></i> Playlist</li>
      <li class="nav-item"><i class="fa-solid fa-heart"></i> Favorites</li>
    </ul>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <header>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
        <input type="text" id="search-input" placeholder="Search track title or artist...">
      </div>

      <label class="file-upload-btn">
        <i class="fa-solid fa-folder-open"></i> Import Local Songs
        <input type="file" id="file-input" accept="audio/*" multiple>
      </label>
    </header>

    <div class="hero-banner">
      <div class="hero-text">
        <h1>Dynamic Audio Engine</h1>
        <p>Stream built-in library tracks or play any local MP3 file directly.</p>
      </div>
      <canvas id="visualizer"></canvas>
    </div>

    <h2 class="section-title">Music Library</h2>
    <div class="music-grid" id="music-grid">
      <!-- Tracks rendered dynamically via JavaScript -->
    </div>
  </main>

  <!-- Bottom Player Container -->
  <div class="player-bar">
    <div class="track-info">
      <img src="https://picsum.photos/200/200?random=1" id="player-thumb" class="track-thumb" alt="Album Cover">
      <div class="track-details">
        <div class="name" id="player-title">Select a Track</div>
        <div class="artist" id="player-artist">Ready to Play</div>
      </div>
    </div>

    <div class="controls-center">
      <div class="control-buttons">
        <button class="btn-action" id="btn-shuffle"><i class="fa-solid fa-shuffle"></i></button>
        <button class="btn-action" id="btn-prev"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn-play-pause" id="btn-play"><i class="fa-solid fa-play"></i></button>
        <button class="btn-action" id="btn-next"><i class="fa-solid fa-forward-step"></i></button>
        <button class="btn-action" id="btn-repeat"><i class="fa-solid fa-repeat"></i></button>
      </div>
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span id="total-duration">0:00</span>
      </div>
    </div>

    <div class="extra-controls">
      <i class="fa-solid fa-volume-high" style="color: var(--text-muted);"></i>
      <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>

  <audio id="audio-element" crossorigin="anonymous"></audio>

  <script>
    // Audio State Engine & Sample Tracks
    let playlist = [
      {
        title: "Lofi Ambient Beats",
        artist: "ChillHop Studios",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        cover: "https://picsum.photos/200/200?random=10"
      },
      {
        title: "Synthwave Horizon",
        artist: "Retro Dynamic",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        cover: "https://picsum.photos/200/200?random=11"
      },
      {
        title: "Cybernetic Pulse",
        artist: "Future Bass Core",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
        cover: "https://picsum.photos/200/200?random=12"
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    // DOM Elements
    const audio = document.getElementById('audio-element');
    const playBtn = document.getElementById('btn-play');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const shuffleBtn = document.getElementById('btn-shuffle');
    const repeatBtn = document.getElementById('btn-repeat');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const volumeSlider = document.getElementById('volume-slider');
    const playerTitle = document.getElementById('player-title');
    const playerArtist = document.getElementById('player-artist');
    const playerThumb = document.getElementById('player-thumb');
    const musicGrid = document.getElementById('music-grid');
    const fileInput = document.getElementById('file-input');
    const searchInput = document.getElementById('search-input');

    // Visualizer Setup
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');
    let audioCtx, analyser, source, dataArray;

    function initVisualizer() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      analyser.fftSize = 64;
      
      const bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      
      drawVisualizer();
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyser) return;

      analyser.getByteFrequencyData(dataArray);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / dataArray.length) * 2;
      let x = 0;

      for (let i = 0; i < dataArray.length; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        canvasCtx.fillStyle = '#ff2a5f';
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
        x += barWidth;
      }
    }

    // Render Grid
    function renderGrid(tracks) {
      musicGrid.innerHTML = '';
      tracks.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'music-card';
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${track.cover}" alt="Cover">
            <div class="play-overlay">
              <div class="play-btn-icon"><i class="fa-solid fa-play"></i></div>
            </div>
          </div>
          <div class="card-title">${track.title}</div>
          <div class="card-artist">${track.artist}</div>
        `;
        card.onclick = () => {
          currentIndex = index;
          loadTrack(currentIndex);
          playTrack();
        };
        musicGrid.appendChild(card);
      });
    }

    // Audio Playback Actions
    function loadTrack(index) {
      const track = playlist[index];
      if (!track) return;

      audio.src = track.src;
      playerTitle.textContent = track.title;
      playerArtist.textContent = track.artist;
      playerThumb.src = track.cover;
    }

    function playTrack() {
      if (!audioCtx) initVisualizer();
      audio.play();
      isPlaying = true;
      playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    }

    function pauseTrack() {
      audio.pause();
      isPlaying = false;
      playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
    }

    playBtn.onclick = () => {
      if (isPlaying) pauseTrack();
      else {
        if (!audio.src) loadTrack(currentIndex);
        playTrack();
      }
    };

    nextBtn.onclick = () => {
      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * playlist.length);
      } else {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      loadTrack(currentIndex);
      playTrack();
    };

    prevBtn.onclick = () => {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex);
      playTrack();
    };

    shuffleBtn.onclick = () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
    };

    repeatBtn.onclick = () => {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle('active', isRepeat);
    };

    // Time & Progress Formatting
    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${progress}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        totalDurationEl.textContent = formatTime(audio.duration);
      }
    };

    audio.onended = () => {
      if (isRepeat) {
        playTrack();
      } else {
        nextBtn.click();
      }
    };

    progressBar.onclick = (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * audio.duration;
    };

    volumeSlider.oninput = (e) => {
      audio.volume = e.target.value;
    };

    // Handle Local File Uploads
    fileInput.onchange = (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const fileUrl = URL.createObjectURL(file);
        playlist.unshift({
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "Local Storage",
          src: fileUrl,
          cover: "https://picsum.photos/200/200?random=" + Math.floor(Math.random() * 100)
        });
      });
      renderGrid(playlist);
      loadTrack(0);
      playTrack();
    };

    // Search Filter
    searchInput.oninput = (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = playlist.filter(track => 
        track.title.toLowerCase().includes(query) || 
        track.artist.toLowerCase().includes(query)
      );
      renderGrid(filtered);
    };

    // Initialize Page
    renderGrid(playlist);
    loadTrack(0);
  </script>
</body>
</html>
