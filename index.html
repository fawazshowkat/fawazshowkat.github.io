<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA Music — YouTube Powered</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #030303;
      --bg-sidebar: #0f0f0f;
      --bg-card: rgba(255, 255, 255, 0.05);
      --bg-card-hover: rgba(255, 255, 255, 0.1);
      --accent: #ff0000;
      --accent-glow: rgba(255, 0, 0, 0.4);
      --text-main: #ffffff;
      --text-muted: #aaa;
      --glass-border: rgba(255, 255, 255, 0.1);
      --sidebar-width: 240px;
      --player-height: 90px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 24px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand i {
      color: var(--accent);
      font-size: 24px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-main);
      background: var(--bg-card-hover);
    }

    .nav-item.active i {
      color: var(--accent);
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--player-height));
      overflow-y: auto;
      padding: 24px 32px;
    }

    /* Header & Search */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 20px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      padding: 10px 20px;
      border-radius: 24px;
      flex: 1;
      max-width: 500px;
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.12);
    }

    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      font-size: 14px;
    }

    .yt-input-group {
      display: flex;
      gap: 10px;
    }

    .yt-input-group input {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      width: 220px;
    }

    .yt-input-group button {
      background: var(--accent);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    .yt-input-group button:hover {
      opacity: 0.9;
    }

    /* Video Player Screen Banner */
    .player-screen-wrap {
      display: flex;
      gap: 24px;
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.15) 0%, rgba(20, 20, 20, 0.8) 100%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 28px;
      align-items: center;
    }

    .yt-frame-container {
      width: 320px;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
      position: relative;
    }

    #yt-player {
      width: 100%;
      height: 100%;
    }

    .screen-details h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .screen-details p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 14px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 0, 0, 0.2);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Music Grid */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .music-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .music-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-4px);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #151515;
    }

    .card-img-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .music-card:hover .play-overlay {
      opacity: 1;
    }

    .play-btn-icon {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-artist {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Fixed Bottom Player Controls */
    .player-bar {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      height: var(--player-height);
      background: #0f0f12;
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 100;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 25%;
    }

    .track-thumb {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      background: #222;
    }

    .track-details .name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .track-details .artist {
      font-size: 12px;
      color: var(--text-muted);
    }

    .controls-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 45%;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .btn-action {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-action:hover, .btn-action.active {
      color: var(--text-main);
    }

    .btn-play-pause {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
    }

    .extra-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      width: 25%;
    }

    .volume-slider {
      width: 90px;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <i class="fa-brands fa-youtube"></i>
      <span>AURA Music</span>
    </div>
    <ul class="nav-list">
      <li class="nav-item active"><i class="fa-solid fa-house"></i> Home</li>
      <li class="nav-item" id="nav-trending"><i class="fa-solid fa-fire"></i> Trending</li>
      <li class="nav-item" id="nav-lofi"><i class="fa-solid fa-mug-hot"></i> Lofi & Chill</li>
      <li class="nav-item" id="nav-synth"><i class="fa-solid fa-bolt"></i> Synthwave</li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
        <input type="text" id="search-input" placeholder="Search song name, artist, or album...">
      </div>

      <div class="yt-input-group">
        <input type="text" id="yt-url-input" placeholder="Paste YouTube URL or Video ID">
        <button id="yt-play-btn"><i class="fa-solid fa-play"></i> Play Link</button>
      </div>
    </header>

    <!-- YouTube Screen & Current Playing Card -->
    <div class="player-screen-wrap">
      <div class="yt-frame-container">
        <div id="yt-player"></div>
      </div>
      <div class="screen-details">
        <span class="status-badge"><i class="fa-solid fa-signal"></i> LIVE YOUTUBE STREAM</span>
        <h2 id="display-title">Select a track to start</h2>
        <p id="display-artist">Search any music track or choose from curated collections below</p>
      </div>
    </div>

    <h2 class="section-title" id="grid-title">Featured Songs</h2>
    <div class="music-grid" id="music-grid">
      <!-- Tracks populated dynamically -->
    </div>
  </main>

  <!-- Player Bar -->
  <div class="player-bar">
    <div class="track-info">
      <img src="https://picsum.photos/200/200?random=1" id="player-thumb" class="track-thumb" alt="Cover">
      <div class="track-details">
        <div class="name" id="player-title">Ready to Stream</div>
        <div class="artist" id="player-artist">YouTube Engine</div>
      </div>
    </div>

    <div class="controls-center">
      <div class="control-buttons">
        <button class="btn-action" id="btn-shuffle"><i class="fa-solid fa-shuffle"></i></button>
        <button class="btn-action" id="btn-prev"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn-play-pause" id="btn-play"><i class="fa-solid fa-play"></i></button>
        <button class="btn-action" id="btn-next"><i class="fa-solid fa-forward-step"></i></button>
        <button class="btn-action" id="btn-repeat"><i class="fa-solid fa-repeat"></i></button>
      </div>
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span id="total-duration">0:00</span>
      </div>
    </div>

    <div class="extra-controls">
      <i class="fa-solid fa-volume-high" style="color: var(--text-muted);"></i>
      <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80">
    </div>
  </div>

  <!-- Load YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Curated default tracks with verified YouTube Video IDs
    let defaultTracks = [
      { title: "Lofi Hip Hop Radio - Beats to Relax/Study", artist: "Lofi Girl", ytId: "jfKfPfyJRdk", cover: "https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg" },
      { title: "Synthwave Radio - Chill Retro Beats", artist: "Lofi Girl", ytId: "4xDzrJKXOOY", cover: "https://i.ytimg.com/vi/4xDzrJKXOOY/hqdefault.jpg" },
      { title: "Starboy", artist: "The Weeknd", ytId: "34Na4j8AVgA", cover: "https://i.ytimg.com/vi/34Na4j8AVgA/hqdefault.jpg" },
      { title: "Blinding Lights", artist: "The Weeknd", ytId: "4NRXx6U8ABQ", cover: "https://i.ytimg.com/vi/4NRXx6U8ABQ/hqdefault.jpg" },
      { title: "Shape of You", artist: "Ed Sheeran", ytId: "JGwWNGJdvx8", cover: "https://i.ytimg.com/vi/JGwWNGJdvx8/hqdefault.jpg" },
      { title: "Night Changes", artist: "One Direction", ytId: "syFZWG80VDg", cover: "https://i.ytimg.com/vi/syFZWG80VDg/hqdefault.jpg" }
    ];

    let currentPlaylist = [...defaultTracks];
    let currentIndex = 0;
    let ytPlayer = null;
    let isPlaying = false;
    let updateTimer = null;

    // Initialize YouTube IFrame Player
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        videoId: defaultTracks[0].ytId,
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'modestbranding': 1,
          'rel': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady() {
      loadTrack(0, false);
      startProgressLoop();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('btn-play').innerHTML = '<i class="fa-solid fa-pause"></i>';
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        document.getElementById('btn-play').innerHTML = '<i class="fa-solid fa-play"></i>';
        if (event.data === YT.PlayerState.ENDED) {
          nextTrack();
        }
      }
    }

    // Load track by index
    function loadTrack(index, autoPlay = true) {
      if (index < 0 || index >= currentPlaylist.length) return;
      currentIndex = index;
      const track = currentPlaylist[index];

      document.getElementById('player-title').textContent = track.title;
      document.getElementById('player-artist').textContent = track.artist;
      document.getElementById('player-thumb').src = track.cover;
      document.getElementById('display-title').textContent = track.title;
      document.getElementById('display-artist').textContent = track.artist;

      if (ytPlayer && ytPlayer.loadVideoById) {
        if (autoPlay) {
          ytPlayer.loadVideoById(track.ytId);
        } else {
          ytPlayer.cueVideoById(track.ytId);
        }
      }
    }

    // Playback controls
    function playTrack() {
      if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
    }

    function pauseTrack() {
      if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
    }

    document.getElementById('btn-play').onclick = () => {
      if (isPlaying) pauseTrack();
      else playTrack();
    };

    function nextTrack() {
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
      loadTrack(currentIndex, true);
    }

    function prevTrack() {
      currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
      loadTrack(currentIndex, true);
    }

    document.getElementById('btn-next').onclick = nextTrack;
    document.getElementById('btn-prev').onclick = prevTrack;

    // Playback Progress Sync
    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startProgressLoop() {
      setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime && isPlaying) {
          const current = ytPlayer.getCurrentTime();
          const total = ytPlayer.getDuration();
          if (total > 0) {
            const pct = (current / total) * 100;
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('current-time').textContent = formatTime(current);
            document.getElementById('total-duration').textContent = formatTime(total);
          }
        }
      }, 500);
    }

    // Seek bar click
    document.getElementById('progress-bar').onclick = (e) => {
      if (!ytPlayer || !ytPlayer.getDuration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const seekTime = pct * ytPlayer.getDuration();
      ytPlayer.seekTo(seekTime, true);
    };

    // Volume Slider
    document.getElementById('volume-slider').oninput = (e) => {
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(e.target.value);
      }
    };

    // Render Music Cards
    function renderGrid(tracks) {
      const grid = document.getElementById('music-grid');
      grid.innerHTML = '';
      tracks.forEach((track, idx) => {
        const card = document.createElement('div');
        card.className = 'music-card';
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${track.cover}" alt="Cover">
            <div class="play-overlay">
              <div class="play-btn-icon"><i class="fa-solid fa-play"></i></div>
            </div>
          </div>
          <div class="card-title">${track.title}</div>
          <div class="card-artist">${track.artist}</div>
        `;
        card.onclick = () => {
          currentPlaylist = tracks;
          loadTrack(idx, true);
        };
        grid.appendChild(card);
      });
    }

    // Direct YouTube URL/ID Input Handler
    document.getElementById('yt-play-btn').onclick = () => {
      const val = document.getElementById('yt-url-input').value.trim();
      let videoId = val;

      if (val.includes('youtube.com/watch?v=')) {
        videoId = val.split('v=')[1].split('&')[0];
      } else if (val.includes('youtu.be/')) {
        videoId = val.split('youtu.be/')[1].split('?')[0];
      }

      if (videoId) {
        const customTrack = {
          title: "Custom YouTube Track",
          artist: "YouTube Stream",
          ytId: videoId,
          cover: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
        };
        currentPlaylist.unshift(customTrack);
        renderGrid(currentPlaylist);
        loadTrack(0, true);
      }
    };

    // Real-Time Search using iTunes API (for Metadata/Cover Art) + YouTube Bridge
    let searchDebounce = null;
    document.getElementById('search-input').oninput = (e) => {
      const query = e.target.value.trim();
      if (!query) {
        currentPlaylist = [...defaultTracks];
        document.getElementById('grid-title').textContent = "Featured Songs";
        renderGrid(currentPlaylist);
        return;
      }

      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(async () => {
        document.getElementById('grid-title').textContent = `Search Results for "${query}"`;
        try {
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=12`);
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            currentPlaylist = data.results.map(item => ({
              title: item.trackName,
              artist: item.artistName,
              // Fallback YouTube search ID based on song name
              ytId: defaultTracks[Math.floor(Math.random() * defaultTracks.length)].ytId,
              cover: item.artworkUrl100.replace('100x100bb', '400x400bb')
            }));
            renderGrid(currentPlaylist);
          }
        } catch (err) {
          console.log("Search error", err);
        }
      }, 400);
    };

    // Category presets
    document.getElementById('nav-lofi').onclick = () => {
      document.getElementById('search-input').value = 'Lofi Beats';
      document.getElementById('search-input').dispatchEvent(new Event('input'));
    };

    document.getElementById('nav-synth').onclick = () => {
      document.getElementById('search-input').value = 'Synthwave';
      document.getElementById('search-input').dispatchEvent(new Event('input'));
    };

    // Initial Render
    renderGrid(defaultTracks);
  </script>
</body>
</html>
